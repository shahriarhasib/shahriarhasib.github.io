<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin</title><link rel="icon" href="../assets/img/favicon.svg">
<style>
:root{--a:#4a6cf7;--b:#f4f6fb;--t:#1b2333;--m:#667}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,sans-serif;background:var(--b);color:var(--t)}
.box{max-width:420px;margin:12vh auto;background:#fff;padding:28px;border-radius:14px;box-shadow:0 8px 30px #0001}
button{background:var(--a);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}button.g{background:#e8ecf7;color:var(--t)}button.d{background:#d9363e}
input,textarea,select{width:100%;padding:7px 9px;border:1px solid #ccd;border-radius:7px;font:inherit}textarea{min-height:70px}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff;padding:10px 16px;position:sticky;top:0;box-shadow:0 1px 6px #0001;z-index:2}.top b{margin-right:auto}.top input{width:230px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:12px 16px}.tabs button{background:#fff;color:var(--t);border:1px solid #d5daea}.tabs button.on{background:var(--a);color:#fff}
.rows{padding:0 16px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.r{background:#fff;border-radius:12px;padding:14px;box-shadow:0 2px 8px #0001}.r label{display:block;font-size:11px;color:var(--m);margin:8px 0 2px;text-transform:uppercase}
.act{display:flex;gap:8px;margin-top:12px}#msg{color:#c33;margin-top:10px}.h{display:block;color:var(--m);font-size:11px;margin-top:2px}.imgf .ip{display:flex;gap:10px;align-items:center;margin-top:6px}.imgf .ip img{width:84px;height:64px;object-fit:contain;background:#eef0f7;border-radius:8px}.imgf small{display:block;color:var(--m);font-size:11px;margin-top:4px}.ok{color:#197a3e!important}.ro{opacity:.6}
</style></head><body>
<div id="login" class="box"><h2 style="margin-top:0">Admin sign-in</h2>
<div id="gbtn"></div><p id="gnote" style="color:var(--m);font-size:12px"></p><hr style="border:0;border-top:1px solid #e3e6f0;margin:16px 0">
<p><button id="oauth" style="width:100%">Sign in with GitHub</button></p>
<label style="display:block"><input type="checkbox" id="rem" style="width:auto" checked> Keep me signed in on this device</label>
<details style="margin-top:14px"><summary style="cursor:pointer;color:var(--m)">Use a token instead</summary><input id="gt" type="password" placeholder="github_pat_..." style="margin:8px 0"><button id="ghb" class="g">Sign in with token</button></details><div id="msg"></div></div>
<div id="app" hidden><div class="top"><b id="who"></b><input id="tok" type="password" placeholder="GitHub token (needed to publish)"><button id="pub">Publish to GitHub</button><button class="g" id="out">Sign out</button></div><div class="tabs" id="tabs"></div><div class="rows" id="rows"></div></div>
<script>window.BASE='../'</script>
<script src="../assets/js/config.js"></script><script src="../assets/js/dbcore.js"></script>
<script>
const $=i=>document.getElementById(i),GH='https://api.github.com',TEXTY=['value','brief','details','about','description','typed_roles'],FLAGS=['home','active'];
const TABS={home_hero:'Home hero & photos',sections:'Section titles',profile:'Profile (About)',stats:'About stats',skills:'Skills',experience:'Experience',education:'Education',services:'Services',portfolio:'Portfolio',highlights:'Strengths slider',contact:'Contact',users:'Users & roles'},TABLES=Object.keys(TABS);
const LABEL={brief:'Brief for home page',home:'Show on home page',sort:'Order (small number first)',id:'ID',group_icon:'Group icon (uil- class)',group_image:'Group icon image (upload)',icon:'Icon (uil- class)',image:'Image (upload)',logo:'Skill logo (upload)',photo:'Home photo (upload)',about_photo:'About-section photo (upload)',page_title:'Detail page title',page_subtitle:'Detail page subtitle',title:'Title (home section heading)',subtitle:'Subtitle (home section sub-heading)',typed_roles:'Typed roles (one per line)',greeting:'Greeting (e.g. Hi!)',name_line:"Name line (e.g. I'm Shahriar)",subprefix:'Text before typed role',button_text:'Button text',button:'Button text',description:'Description',key_role:'Key role (short)',details:'Details (shown on the detail page)',pages:'Editor can edit these tables (comma-separated)'};
const HINT={'sections.title':'Heading shown on the HOME page section. The "project" row is the blue banner (title, subtitle = text, button, image).','services.brief':'Shown in the home-page pop-up. One point per line.','experience.brief':'Shown on the home page. One bullet per line.','education.brief':'Short text for the home page.','skills.home':'Tick = this skill/group appears on the home page.','services.icon':'Unicons class, e.g. uil-server-network. Or upload an image instead.','home_hero.typed_roles':'The roles that auto-type under your name.','profile.about_brief':'Short About text shown on the home page.','profile.about':'Full About text (detail page). New line = new paragraph.'};
const SPEC={'home_hero.photo':[500,500,'1:1 square, transparent PNG works best',1],'home_hero.about_photo':[1080,853,'about 5:4 landscape',0],'sections.image':[484,516,'about 1:1 (banner picture)',1],'portfolio.image':[640,426,'3:2 landscape',0],'skills.logo':[64,64,'1:1 square',1],'skills.group_image':[64,64,'1:1 square',1],'services.image':[96,96,'1:1 square',1],'experience.image':[96,96,'1:1 square logo',1],'education.image':[600,420,'landscape card photo, about 10:7',0]};
let db,user,cur,dirty=false,token=localStorage.gh||sessionStorage.gh||'';const PREV={};
const say=(m,ok)=>{$('msg').textContent=m;$('msg').className=ok?'ok':''};
const gh=(p,o={})=>fetch(GH+p,{...o,headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json'}});
const canEdit=t=>user.role==='admin'||(user.role==='editor'&&t!=='users'&&(user.pages||'').split(',').map(s=>s.trim()).includes(t));
async function enter(provider,id,name){
 try{db=db||await openDB()}catch(e){return say('Could not load the database.')}
 const u=rows(db,'SELECT * FROM users WHERE provider=? AND lower(identifier)=lower(?) AND active=1',[provider,id])[0];
 if(!u)return say(`"${id}" is not an allowed ${provider} account.`);
 user={...u,name};$('login').hidden=true;$('app').hidden=false;
 $('who').textContent=`${name} (${provider}) · role: ${u.role}`;$('tok').value=token;
 $('tabs').innerHTML=TABLES.filter(t=>t!=='users'||u.role==='admin').map(t=>`<button data-t="${t}">${TABS[t]}</button>`).join('');tab(TABLES[0]);
}
$('ghb').onclick=async()=>{token=$('gt').value.trim();if(!token)return say('Paste a token first.');
 const r=await gh('/user');if(!r.ok)return say('GitHub rejected this token.');const j=await r.json();sessionStorage.gh=token;if($('rem').checked)localStorage.gh=token;enter('github',j.login,j.login)};
function gcb(r){const p=JSON.parse(decodeURIComponent(escape(atob(r.credential.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))));
 if(!p.email_verified)return say('Google email not verified.');enter('google',p.email,p.name||p.email)}
(function g(){if(!CFG.GOOGLE_CLIENT_ID){$('gnote').textContent='Google sign-in: set GOOGLE_CLIENT_ID in assets/js/config.js.';return}
 const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=()=>{google.accounts.id.initialize({client_id:CFG.GOOGLE_CLIENT_ID,callback:gcb});google.accounts.id.renderButton($('gbtn'),{theme:'outline',size:'large',text:'signin_with'})};document.body.appendChild(s)})();
(async function cb(){const q=new URLSearchParams(location.search);if(!q.get('code'))return;history.replaceState({},'',location.pathname);
 if(q.get('state')!==sessionStorage.st)return say('Sign-in check failed. Please try again.');say('Signing in...',1);
 try{const r=await fetch(CFG.AUTH_WORKER,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:q.get('code')})});const j=await r.json();
 if(!j.access_token)return say(j.error||'GitHub sign-in failed.');token=j.access_token;sessionStorage.gh=token;if(sessionStorage.rem)localStorage.gh=token;enter('github',j.login,j.login)}catch(e){say('Could not reach the sign-in service.')}})();
$('oauth').onclick=()=>{if(!CFG.GH_CLIENT_ID||!CFG.AUTH_WORKER)return say('GitHub sign-in is not configured yet (GH_CLIENT_ID / AUTH_WORKER in config.js).');
 const s=crypto.randomUUID();sessionStorage.st=s;sessionStorage.rem=$('rem').checked?'1':'';
 location.href='https://github.com/login/oauth/authorize?'+new URLSearchParams({client_id:CFG.GH_CLIENT_ID,scope:'public_repo',state:s,redirect_uri:location.origin+location.pathname})};
function tab(t){cur=t;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));draw()}
function field(c,v,ro){const n=c.name,k=cur+'.'+n,sp=SPEC[k],lab=LABEL[n]||n,hint=HINT[k]||HINT[n]||'';let inp;
 if(FLAGS.includes(n))inp=`<input type="checkbox" data-c="${n}" ${v?'checked':''} ${ro} style="width:auto">`;
 else if(n==='role')inp=`<select data-c="role" ${ro}>${['admin','editor','viewer'].map(o=>`<option ${o===v?'selected':''}>${o}</option>`)}</select>`;
 else if(sp){const src=v?(PREV[v]||'../assets/img/'+v):'';inp=`<div class="imgf"><input data-c="${n}" value="${esc(v)}" ${ro} placeholder="file name"><div class="ip">${src?`<img src="${src}" alt="">`:'<span>no image</span>'}<div><button type="button" class="g" data-up="${n}" ${ro}>Upload image</button><small>Suggested ${sp[0]}×${sp[1]} px (${sp[2]}). Auto-cropped to fit.</small></div></div></div>`}
 else if(TEXTY.includes(n))inp=`<textarea data-c="${n}" ${ro}>${esc(v)}</textarea>`;
 else inp=`<input data-c="${n}" data-n="${c.type==='INTEGER'?1:0}" value="${esc(v)}" ${ro}>`;
 return `<label>${esc(lab)}</label>${inp}${hint?`<small class="h">${esc(hint)}</small>`:''}`}
function draw(){const info=rows(db,`PRAGMA table_info(${cur})`),ed=canEdit(cur),data=tbl(db,cur),single=cur==='home_hero';
 $('rows').innerHTML=(ed&&!(single&&data.length)?`<div><button id="add">+ Add row</button></div>`:!ed?'<div class="ro">Read-only for your role.</div>':'')+data.map(r=>`<div class="r" data-id="${r.id}">`+info.map(c=>field(c,r[c.name],c.name==='id'||!ed?'disabled':'')).join('')+(ed?`<div class="act"><button data-a="save">Save</button>${single?'':'<button class="d" data-a="del">Delete</button>'}</div>`:'')+'</div>').join('')}
async function upload(card,col,file){const sp=SPEC[cur+'.'+col];if(!token)return alert('Sign in with GitHub (or enter a token above) first: images are saved to your repo.');
 try{const bm=await createImageBitmap(file),[w,h,,png]=sp,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d'),k=Math.max(w/bm.width,h/bm.height),dw=bm.width*k,dh=bm.height*k;x.drawImage(bm,(w-dw)/2,(h-dh)/2,dw,dh);
 const url=c.toDataURL(png?'image/png':'image/jpeg',.88),ext=png?'png':'jpg',name='uploads/'+Date.now()+'-'+col+'.'+ext;
 const r=await gh(`/repos/${CFG.GH_OWNER}/${CFG.GH_REPO}/contents/assets/img/${name}`,{method:'PUT',body:JSON.stringify({message:'Upload image ('+user.name+')',content:url.split(',')[1],branch:CFG.GH_BRANCH})});
 if(!r.ok)return alert('Upload failed: '+(await r.json()).message);
 PREV[name]=url;const inp=card.querySelector(`[data-c="${col}"]`);inp.value=name;card.querySelector('.ip').innerHTML=`<img src="${url}" alt=""><div><b style="color:#197a3e">Uploaded.</b> Now click Save, then Publish.</div>`}catch(e){alert('Could not read that image.')}}
document.addEventListener('click',e=>{const b=e.target;
 if(b.dataset.t)return tab(b.dataset.t);
 if(b.dataset.up){const card=b.closest('.r'),col=b.dataset.up,f=document.createElement('input');f.type='file';f.accept='image/*';f.onchange=()=>f.files[0]&&upload(card,col,f.files[0]);return f.click()}
 if(b.id==='add'&&canEdit(cur)){db.run(`INSERT INTO ${cur} DEFAULT VALUES`);dirty=true;return draw()}
 const card=b.closest('.r');if(!card||!b.dataset.a||!canEdit(cur))return;const id=card.dataset.id;
 if(b.dataset.a==='del'){if(!confirm('Delete this row?'))return;db.run(`DELETE FROM ${cur} WHERE id=?`,[id]);dirty=true;return draw()}
 const f=[...card.querySelectorAll('[data-c]')].filter(x=>x.dataset.c!=='id');
 db.run(`UPDATE ${cur} SET ${f.map(x=>x.dataset.c+'=?').join(',')} WHERE id=?`,f.map(x=>x.type==='checkbox'?+x.checked:x.dataset.n==='1'?Number(x.value):x.value).concat([id]));dirty=true;b.textContent='Saved ✓';setTimeout(()=>b.textContent='Save',1200)});
$('pub').onclick=async()=>{token=$('tok').value.trim()||token;if(!token)return alert('Enter a GitHub token with Contents write access.');sessionStorage.gh=token;
 const bin=db.export();let s='';for(let i=0;i<bin.length;i+=8192)s+=String.fromCharCode.apply(null,bin.subarray(i,i+8192));
 const p=`/repos/${CFG.GH_OWNER}/${CFG.GH_REPO}/contents/data/portfolio.db`;const g=await gh(p+'?ref='+CFG.GH_BRANCH);
 const r=await gh(p,{method:'PUT',body:JSON.stringify({message:'Update portfolio data ('+user.name+')',content:btoa(s),sha:g.ok?(await g.json()).sha:undefined,branch:CFG.GH_BRANCH})});
 alert(r.ok?'Published. The live site updates in about a minute.':'Publish failed: '+(await r.json()).message);if(r.ok)dirty=false};
$('out').onclick=()=>{sessionStorage.clear();localStorage.removeItem('gh');location.reload()};
if(token)gh('/user').then(async r=>{if(r.ok){const j=await r.json();enter('github',j.login,j.login)}else{localStorage.removeItem('gh');sessionStorage.removeItem('gh');token=''}});
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
</script></body></html>
